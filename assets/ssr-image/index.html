<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>ResumI — Your resume just got a new teammate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main aria-label="ResumI social preview">
      <div class="glow" aria-hidden="true"></div>
      <header>
        <div class="brand">
          <img src="assets/resumi-tray.png" alt="" width="72" height="72" />
          <span>Resum<span class="brand-i">I</span></span>
        </div>
        <p class="attribution">By Plinka</p>
      </header>
      <h1>Your resume<br />just got a<br /><span>new teammate.</span></h1>
      <a class="website" href="https://resumi.plinka.eu">resumi.plinka.eu</a>
      <div class="agents" aria-label="AI coding tools">
        <img src="assets/claude.svg" alt="Claude" />
        <img src="assets/openai.svg" alt="Codex / ChatGPT" />
        <img src="assets/grok.svg" alt="Grok" />
        <img src="assets/cursor.svg" alt="Cursor" />
        <img class="opencode" src="assets/opencode.svg" alt="OpenCode" />
        <img src="assets/meta.svg" alt="Muse Code" />
      </div>
      <div class="resume-stack" aria-hidden="true">
        <img
          class="resume resume-primary"
          src="assets/resume.png"
          alt=""
          width="794"
          height="1123"
        />
        <img
          class="resume resume-secondary"
          src="assets/resume-secondary.png"
          alt=""
          width="794"
          height="1123"
        />
      </div>
    </main>
  </body>
</html>
