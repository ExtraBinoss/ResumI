name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            artifacts/
            coverage/
            playwright-report/
            test-results/
      - name: Save verified application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumi-website
          path: apps/web/build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish resumi to Cloudflare
    needs: check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ExtraBinoss' &&
      github.triggering_actor == 'ExtraBinoss' &&
      contains(github.event.head_commit.message, '[PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: resumi-production
      cancel-in-progress: false
    steps:
      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets before publishing."
            echo "Publication requested but Cloudflare secrets are missing. No deployment was started." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumi-website
          path: apps/web/build/
      - name: Verify existing Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: resumi
          CLOUDFLARE_PLATFORM: workers
        run: |
          node --input-type=module <<'JS'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account,
            CLOUDFLARE_PROJECT: project, CLOUDFLARE_PLATFORM: platform } = process.env;
          const path = platform === 'pages' ? `/pages/projects/${project}` : '/workers/workers';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
            headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Cloudflare target verification failed (HTTP ${response.status}).`);
          const data = await response.json();
          const exists = platform === 'pages' ? data.result?.name === project :
            Array.isArray(data.result) && data.result.some(worker => worker.name === project);
          if (!data.success || !exists) throw new Error('Cloudflare target is missing. Provision it before publishing.');
          console.log(`Verified existing ${platform} target: ${project}`);
          JS
      - name: Publish verified build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
